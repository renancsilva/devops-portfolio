global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: node          # server: CPU, memory, disk, network
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers    # per-container CPU and memory
    static_configs:
      - targets: ["cadvisor:8080"]
